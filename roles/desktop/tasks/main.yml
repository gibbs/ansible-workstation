- name: include os specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', os_vars) }}"
  vars:
    os_vars:
      files:
        - "{{ ansible_os_family | lower }}-{{ ansible_architecture }}.yml"
        - "{{ ansible_distribution | lower }}-{{ ansible_distribution_version.split('.')[0] | lower }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: archlinux
  ansible.builtin.include_tasks: archlinux.yml
  when: ansible_os_family == "Archlinux"

- name: ubuntu
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_distribution|lower == "ubuntu"

- name: install pip packages
  ansible.builtin.pip:
    name: "{{ item }}"
    state: present
    extra_args: "{{ desktop_pip_extra_args | default(omit) }}"
  loop: "{{ desktop_pip_packages }}"

- name: ssh initial keygen
  ansible.builtin.command:
    cmd: ssh-keygen -f ~/.ssh/id_rsa -q -N ''
    creates: ~/.ssh/id_rsa

- name: create various directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: 0755
    state: directory
  loop:
    - $HOME/.config/gtk-3.0/
    - $HOME/.config/gtk-4.0/
    - $HOME/.config/nitrogen/
    - $HOME/.config/nitrogen/wallpapers/
    - $HOME/.config/VirtualBox
    - $HOME/.wallpapers/
    - $HOME/.cloud/nextcloud/
    - $HOME/.cloud/dropbox/
    - $HOME/.cloud/dropbox/Dropbox/
    - $HOME/.dropbox/
    - $HOME/virtualbox

- name: create dropbox symlink
  ansible.builtin.file:
    src: $HOME/.cloud/dropbox/Dropbox
    dest: $HOME/dropbox
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: 0755
    state: link

- name: wayland session config
  when: desktop_wayland
  block:
    - name: create wayland config directories
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 0755
        state: directory
      loop:
        - ~/.config/sway
        - ~/.config/environment.d
        - ~/pics

    - name: sway config
      ansible.builtin.template:
        src: sway.config.j2
        dest: ~/.config/sway/config
        mode: 0644
        force: false

    - name: wayland session environment
      ansible.builtin.template:
        src: environment.conf.j2
        dest: ~/.config/environment.d/50-wayland.conf
        mode: 0644

    - name: chromium based browser wayland flags
      ansible.builtin.copy:
        dest: "~/.config/{{ item }}"
        mode: 0644
        content: |
          --ozone-platform-hint=auto
          --enable-features=TouchpadOverscrollHistoryNavigation
      loop:
        - chromium-flags.conf
        - chrome-flags.conf

- name: set gtk 3.0 settings
  ansible.builtin.copy:
    dest: "~/.config/gtk-3.0/settings.ini"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: 0644
    force: false
    content: |
      [Settings]
      gtk-application-prefer-dark-theme={{ desktop_gtk_dark }}
      gtk-theme-name={{ desktop_gtk_theme }}
      gtk-icon-theme-name={{ desktop_gtk_icon_theme }}
      gtk-font-name={{ desktop_gtk_default_font }}

- name: set gtk 4.0 settings
  ansible.builtin.copy:
    dest: "~/.config/gtk-4.0/settings.ini"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: 0644
    force: false
    content: |
      [Settings]
      gtk-application-prefer-dark-theme={{ desktop_gtk_dark }}
      gtk-theme-name={{ desktop_gtk_theme }}
      gtk-icon-theme-name={{ desktop_gtk_icon_theme }}
      gtk-font-name={{ desktop_gtk_default_font }}

- name: clone i3blocks-contrib
  ansible.builtin.git:
    repo: https://github.com/vivien/i3blocks-contrib
    dest: ~/.config/i3blocks/contrib/
    update: false
    version: v2.0.0

- name: virtualbox initial config
  ansible.builtin.template:
    dest: $HOME/.config/VirtualBox/VirtualBox.xml
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: 0600
    src: virtualbox.xml.j2
    force: false

- name: git clone bash_it
  ansible.builtin.git:
    repo: https://github.com/Bash-it/bash-it.git
    dest: ~/.bash_it
    depth: 1
    version: v2.1.4
    update: false

- name: install bash_it
  ansible.builtin.command:
    cmd: ~/.bash_it/install.sh
    creates: ~/.bashrc.bak

- name: copy stow bash script
  ansible.builtin.copy:
    src: stow.sh
    dest: ~/bin/stow-setup
    mode: 0755

- name: execute stow script
  ansible.builtin.command:
    cmd: ~/bin/stow-setup
    creates: ~/tmp/.stow-setup

- name: vscode extensions
  ansible.builtin.command:
    cmd: "code --install-extension {{ item }}"
    creates: "~/.vscode/extensions/{{ item }}*"
  loop: "{{ desktop_vscode_extensions }}"
