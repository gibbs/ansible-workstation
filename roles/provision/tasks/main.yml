---
- name: Include os specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', os_vars) }}"
  vars:
    os_vars:
      files:
        - "{{ ansible_os_family | lower }}-{{ ansible_architecture }}.yml"
        - "{{ ansible_distribution | lower }}-{{ ansible_distribution_version.split('.')[0] | lower }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Copy user-dirs.dirs file
  ansible.builtin.copy:
    src: user-dirs.dirs
    dest: /tmp/user-dirs.dirs
    mode: "0644"

- name: Copy xdg bash script
  ansible.builtin.copy:
    src: xdg.sh
    dest: /tmp/xdg.sh
    mode: "0755"

- name: Execute xdg script
  ansible.builtin.command:
    cmd: /tmp/xdg.sh
    creates: /tmp/.xdg-provision

- name: Archlinux
  ansible.builtin.include_tasks: archlinux.yml
  when: ansible_os_family == "Archlinux"

- name: Ubuntu
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_distribution|lower == "ubuntu"

- name: Set timezone
  community.general.timezone:
    name: "{{ provision_timezone }}"
  become: true

- name: Get current locale and language configuration
  ansible.builtin.command: localectl status
  register: provision_locale_status
  changed_when: false

- name: Parse lang from current locale and language configuration
  ansible.builtin.set_fact:
    provision_locale_lang: "{{ provision_locale_status.stdout | regex_search('LANG=([^\n]+)', '\\1') | default([''], true) | first }}"

- name: Set locale
  ansible.builtin.command:
    cmd: "localectl set-locale LANG={{ provision_locale }}.UTF-8"
  when: provision_locale_lang != provision_locale ~ '.UTF-8'
  changed_when: true
  become: true

- name: Set the gdm default session
  ansible.builtin.copy:
    dest: "/var/lib/AccountsService/users/{{ ansible_user_id }}"
    owner: root
    group: root
    mode: "0600"
    force: false
    content: |
      [User]
      Language=
      Session={{ provision_session }}
      XSession={{ provision_session if provision_session_type == 'x11' else '' }}
  become: true

- name: Set the console font
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: "^FONT="
    line: "FONT={{ provision_console_font }}"
    create: true
    mode: "0644"
  when: provision_console_font is defined
  become: true

- name: Start gdm service
  ansible.builtin.service:
    name: gdm
    enabled: true
  become: true

- name: Create various directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0755"
    state: directory
  loop:
    - $HOME/.cloud
    - $HOME/bin
    - $HOME/tmp
    - $HOME/.fonts
    - $HOME/.icons
    - $HOME/.vim
    - $HOME/.vim/autoload

- name: Clone dotfiles
  ansible.builtin.git:
    repo: "{{ provision_dotfiles_repo }}"
    dest: $HOME/.dotfiles
    force: true
    update: false
    version: "{{ provision_dotfiles_version }}"

- name: Vim plug
  ansible.builtin.get_url:
    dest: ~/.vim/autoload/plug.vim
    url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0644"
